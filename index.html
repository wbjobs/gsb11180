<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地文件 SHA-256 分片哈希</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f6f8; color: #1f2933;
    display: flex; justify-content: center;
  }
  .card {
    width: 100%; max-width: 640px;
    background: #fff; border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
    padding: 28px 32px 32px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  label { font-size: 14px; color: #374151; }
  select, input[type="file"] { font-size: 14px; }
  select { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; }
  button {
    padding: 8px 18px; font-size: 14px; border: none; border-radius: 6px;
    cursor: pointer; background: #2563eb; color: #fff;
  }
  button.secondary { background: #e5e7eb; color: #1f2933; }
  button.danger { background: #dc2626; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .progress-wrap {
    height: 18px; background: #e5e7eb; border-radius: 9px;
    overflow: hidden; position: relative; margin-bottom: 6px;
  }
  #progressBar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #3b82f6, #2563eb);
    transition: width .1s linear;
  }
  #progressText { font-size: 13px; color: #374151; }
  .stats {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px 24px; margin: 16px 0; font-size: 14px;
  }
  .stats .k { color: #6b7280; }
  .hash-box {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; word-break: break-all;
    background: #f3f4f6; border-radius: 8px; padding: 12px;
    margin-bottom: 12px; user-select: all;
  }
  .status { font-size: 14px; min-height: 20px; }
  .status.ok { color: #15803d; }
  .status.error { color: #b91c1c; }
  .status.warn { color: #b45309; }
  .health {
    margin-top: 16px; padding-top: 12px; border-top: 1px solid #e5e7eb;
    font-size: 12px; color: #9ca3af; display: flex; gap: 20px;
  }
  .warn { color: #b45309; }
</style>
</head>
<body>
  <div class="card">
    <h1>本地文件 SHA-256 校验</h1>
    <div class="sub">分片读取 · Web Worker 计算 · 不上传、不存储，文件不离开本机</div>

    <div class="row">
      <input type="file" id="fileInput">
      <label>分片大小
        <select id="chunkSize">
          <option value="1048576">1 MB</option>
          <option value="2097152">2 MB</option>
          <option value="4194304" selected>4 MB</option>
          <option value="8388608">8 MB</option>
          <option value="16777216">16 MB</option>
          <option value="33554432">32 MB</option>
          <option value="67108864">64 MB</option>
        </select>
      </label>
    </div>

    <div class="row">
      <button id="startBtn" disabled>开始</button>
      <button id="pauseBtn" class="secondary" disabled>暂停</button>
      <button id="resumeBtn" class="secondary" disabled>继续</button>
      <button id="cancelBtn" class="danger" disabled>取消</button>
    </div>

    <div class="progress-wrap"><div id="progressBar"></div></div>
    <div id="progressText">0%</div>

    <div class="stats">
      <div><span class="k">已读字节：</span><span id="statBytes">—</span></div>
      <div><span class="k">实时速度：</span><span id="statSpeed">—</span></div>
      <div><span class="k">预计剩余：</span><span id="statEta">—</span></div>
      <div><span class="k">已用时间：</span><span id="statElapsed">—</span></div>
    </div>

    <div class="hash-box" id="hashOutput">—</div>
    <div class="status" id="status">请选择要校验的文件</div>

    <div class="health">
      <span id="fps">FPS: —</span>
      <span id="longtask">长任务: 0</span>
      <span>主线程仅负责 UI，哈希全部在 Worker 中执行</span>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
